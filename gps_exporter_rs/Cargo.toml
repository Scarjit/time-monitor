[package]
name = "gps_exporter_rs"
version = "0.1.0"
edition = "2024"

[dependencies]
prometheus = "0.14.0"
anyhow = "1.0.100"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149" }
axum = "0.8.8"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3