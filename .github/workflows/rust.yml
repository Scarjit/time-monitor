name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  CARGO_TERM_COLOR: always

jobs:
  build-binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
        package:
          - gps_exporter_rs
          - rinex_exporter_rs
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install zigbuild
        run: cargo install cargo-zigbuild

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2

      - name: Build binary
        run: cargo zigbuild --release --target ${{ matrix.target }} -p ${{ matrix.package }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.package }}

  build-and-push-docker:
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        package:
          - gps_exporter_rs
          - rinex_exporter_rs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download binaries for package
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ matrix.package }}-*
          path: ${{ matrix.package }}/target
          merge-multiple: false

      - name: Move binaries to expected paths
        run: |
          mkdir -p ${{ matrix.package }}/target/x86_64-unknown-linux-musl/release
          mkdir -p ${{ matrix.package }}/target/aarch64-unknown-linux-musl/release
          mv ${{ matrix.package }}/target/${{ matrix.package }}-x86_64-unknown-linux-musl/${{ matrix.package }} ${{ matrix.package }}/target/x86_64-unknown-linux-musl/release/
          mv ${{ matrix.package }}/target/${{ matrix.package }}-aarch64-unknown-linux-musl/${{ matrix.package }} ${{ matrix.package }}/target/aarch64-unknown-linux-musl/release/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/scarjit/${{ matrix.package }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.package }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
