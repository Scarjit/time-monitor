name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: scarjit/time-monitor
  CARGO_TERM_COLOR: always

jobs:
  build-binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install zigbuild
        run: cargo install cargo-zigbuild

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2

      - name: Build binary
        run: cargo zigbuild --release --target ${{ matrix.target }}
        working-directory: gps_exporter_rs

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: gps_exporter_rs/target/${{ matrix.target }}/release/gps_exporter_rs

  build-and-push-docker:
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: gps_exporter_rs/target
          merge-multiple: false

      - name: Move binaries to expected paths
        run: |
          mkdir -p gps_exporter_rs/target/x86_64-unknown-linux-musl/release
          mkdir -p gps_exporter_rs/target/aarch64-unknown-linux-musl/release
          mv gps_exporter_rs/target/bin-x86_64-unknown-linux-musl/gps_exporter_rs gps_exporter_rs/target/x86_64-unknown-linux-musl/release/
          mv gps_exporter_rs/target/bin-aarch64-unknown-linux-musl/gps_exporter_rs gps_exporter_rs/target/aarch64-unknown-linux-musl/release/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./gps_exporter_rs
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
